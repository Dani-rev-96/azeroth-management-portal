# DB tunnel SSH bastion
#
# A minimal OpenSSH server whose only job is to forward TCP connections from
# authenticated users to the in-cluster database services. No shell, no home
# directory writes, no password auth — only a single authorized public key.
#
# Restrictions (no shell, restricted `permitopen` list) are enforced via
# per-key options in the `authorized_keys` entry itself — see the secret
# template. This avoids mounting a read-only config drop-in into LSIO's
# `/config` tree (which was causing chown failures + probe flapping) and
# means the restrictions travel with the key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-tunnel-ssh
  namespace: wow
  labels:
    app: db-tunnel-ssh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db-tunnel-ssh
  template:
    metadata:
      labels:
        app: db-tunnel-ssh
    spec:
      containers:
        - name: sshd
          image: linuxserver/openssh-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
            - name: USER_NAME
              value: "tunnel"
            - name: PASSWORD_ACCESS
              value: "false"
            - name: SUDO_ACCESS
              value: "false"
            - name: PUBLIC_KEY_FILE
              value: "/keys/authorized_key"
          ports:
            - name: ssh
              containerPort: 2222
          volumeMounts:
            - name: authorized-key
              mountPath: /keys
              readOnly: true
            # Writable /config so LSIO's init can chown + generate host keys.
            # Host keys are NOT persisted across restarts in v1, so the SSH
            # fingerprint changes on each pod restart. Good enough for v1;
            # swap to a PVC later if stable fingerprints become important.
            - name: config
              mountPath: /config
            # LSIO's custom-cont-init.d hook. Scripts here run (as root) before
            # sshd starts and can adjust the generated sshd_config — we use it
            # to flip AllowTcpForwarding from 'no' (LSIO default) to 'yes'.
            - name: custom-init
              mountPath: /custom-cont-init.d
              readOnly: true
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: authorized-key
          secret:
            secretName: db-tunnel-ssh-authorized-keys
            items:
              - key: authorized_key
                path: authorized_key
                mode: 0400
        - name: config
          emptyDir: {}
        - name: custom-init
          configMap:
            name: db-tunnel-custom-init
            defaultMode: 0755
