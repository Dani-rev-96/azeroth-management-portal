apiVersion: apps/v1
kind: Deployment
metadata:
  name: wow-frontend
  namespace: wow
spec:
  selector:
    matchLabels:
      app: wow-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: wow-frontend
    spec:
      imagePullSecrets:
        - name: docker-home
      containers:
        - name: wow-frontend
          image: docker-hosted.dani-home.de/azeroth-management-portal:1.16.4
          imagePullPolicy: IfNotPresent
          env:
            - name: NITRO_PORT
              value: "80"
            - name: DB_PATH
              value: "/data/sqlite/mappings.db"
            - name: PORTAL_CONFIG_DB_PATH
              value: "/data/sqlite/portal-config.db"
            - name: USER_SETTINGS_DB_PATH
              value: "/data/sqlite/user-settings.db"
            - name: NUXT_PUBLIC_PUBLIC_PATH
              value: "/data/public"
            - name: NUXT_PUBLIC_DIRECTUS_URL
              value: "https://admin.wow-wotlk.dani-home.de"
            - name: NUXT_DIRECTUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: management-access
                  key: access-token
            - name: NUXT_PUBLIC_AUTH_MODE
              value: "oauth-proxy"
            - name: NUXT_DB_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acore-secrets
                  key: acore-user-password
            - name: NUXT_DB_REALM_0_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acore-secrets
                  key: acore-user-password
            - name: NUXT_DB_REALM_0_SOAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acore-secrets
                  key: acore-user-password
            - name: NUXT_DB_REALM_1_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acore-secrets
                  key: acore-user-password
            - name: NUXT_DB_REALM_1_SOAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acore-secrets
                  key: acore-user-password
            - name: NUXT_DB_REALM_2_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acore-secrets
                  key: acore-user-password
            - name: NUXT_DB_REALM_2_SOAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acore-secrets
                  key: acore-user-password
            # DB tunnel: private key is mounted as a file below, path passed via env.
            - name: NUXT_DB_TUNNEL_SSH_PRIVATE_KEY_FILE
              value: "/secrets/db-tunnel/private_key"
            # DB tunnel: Postgres credentials reused from the Directus DB secret.
            - name: NUXT_DB_TUNNEL_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: POSTGRES_USER
            - name: NUXT_DB_TUNNEL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: wow-frontend-env
          resources:
            requests:
              memory: "256Mi"
              cpu: "256m"
            limits:
              memory: "2048Mi"
              cpu: "2000m"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: wow-frontend-sqllite-data
              mountPath: /data/sqlite
            - name: wow-frontend-data
              mountPath: /data/public
            - name: db-tunnel-client-key
              mountPath: /secrets/db-tunnel
              readOnly: true
      volumes:
        - name: wow-frontend-sqllite-data
          persistentVolumeClaim:
            claimName: wow-frontend-sqllite-data
        - name: wow-frontend-data
          persistentVolumeClaim:
            claimName: wow-frontend-data
        - name: db-tunnel-client-key
          secret:
            secretName: db-tunnel-ssh-client-key
            items:
              - key: private_key
                path: private_key
                mode: 0400
