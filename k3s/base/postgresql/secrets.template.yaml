# PostgreSQL Secrets (verschlüsselt mit SOPS)
# Dieses Template zeigt die erwartete Struktur
# Erstellen Sie die verschlüsselte Version mit: sops -e secrets.yaml > secrets.enc.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secrets
  namespace: wow
type: Opaque
stringData:
  POSTGRES_USER: directus
  POSTGRES_PASSWORD: <dbuserpass>
  PGDATA: /var/lib/postgresql/data/pgdata

