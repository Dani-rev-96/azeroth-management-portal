# Directus Secrets (verschlüsselt mit SOPS)
# Dieses Template zeigt die erwartete Struktur
# Erstellen Sie die verschlüsselte Version mit: sops -e secrets.yaml > secrets.enc.yaml
apiVersion: v1
kind: Secret
metadata:
  name: directus-secrets
  namespace: wow
type: Opaque
stringData:
  AUTH_KEYCLOAK_CLIENT_SECRET: <secret>
  SECRET: <secret>
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: CHANGE_ME_TO_SECURE_PASSWORD
  DB_USER: directus
  DB_PASSWORD: <dbuserpass>
